<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>

	<match target="font">
		<edit mode="assign" name="rgba">
			<const>rgb</const>
		</edit>
	</match>

	<match target="font">
		<edit mode="assign" name="hinting">
			<bool>true</bool>
		</edit>
	</match>

	<match target="font">
		<edit mode="assign" name="antialias">
			<bool>true</bool>
		</edit>
	</match>

	<match target="font">
		<edit mode="assign" name="hintstyle">
			<const>hintslight</const>
		</edit>
	</match>

	<match target="font">
		<edit mode="assign" name="lcdfilter">
			<const>lcddefault</const>
		</edit>
	</match>

	<match target="pattern">
		<test name="family" qual="any">
			<string>Arial</string>
		</test>
		<edit binding="same" mode="assign" name="family">
			<string>Liberation Sans</string>
		</edit>
	</match>

	<match target="pattern">
		<test name="family" qual="any">
			<string>Times New Roman</string>
		</test>
		<edit binding="same" mode="assign" name="family">
			<string>Liberation Serif</string>
		</edit>
	</match>

	<match target="pattern">
		<test name="family" qual="any">
			<string>Courier New</string>
		</test>
		<edit binding="same" mode="assign" name="family">
			<string>Liberation Mono</string>
		</edit>
	</match>

	<!-- Default font for the zh_CN locale (no fc-match pattern) -->
	<match>
		<test compare="contains" name="lang">
			<string>zh_CN</string>
		</test>
		<edit mode="prepend" name="family">
			<string>Noto Sans CJK SC</string>
		</edit>
	</match>

	<!-- Default sans-serif font -->
	<match target="pattern">
		<test name="family" qual="any">
			<string>sans-serif</string>
		</test>
		<edit binding="same" mode="prepend" name="family">
			<string>Noto Sans</string>
		</edit>
	</match>

	<!-- system-ui as an alias for sans-serif -->
	<match target="pattern">
		<test name="family">
			<string>system-ui</string>
		</test>
		<edit binding="strong" mode="prepend" name="family">
			<string>sans-serif</string>
		</edit>
	</match>

	<!-- Default serif fonts -->
	<match target="pattern">
		<test name="family" qual="any">
			<string>serif</string>
		</test>
		<edit binding="same" mode="prepend" name="family">
			<string>Noto Serif</string>
		</edit>
	</match>

	<!-- Default monospace fonts -->
	<match target="pattern">
		<test name="family" qual="any">
			<string>monospace</string>
		</test>
		<edit binding="same" mode="prepend" name="family">
			<string>Inconsolata Nerd Font</string>
		</edit>
	</match>

	<!-- Default coding fonts -->
	<match target="pattern">
		<test name="family" qual="any">
			<string>coding</string>
		</test>
		<edit binding="same" mode="prepend" name="family">
			<string>FiraCode Nerd Font Mono</string>
		</edit>
	</match>

	<!-- Fallback fonts preference order -->
	<alias>
		<family>sans-serif</family>
		<prefer>
			<family>Noto Sans</family>
			<family>Noto Sans CJK SC</family>
			<family>Noto Sans CJK TC</family>
			<family>Noto Sans CJK JP</family>
			<family>Noto Sans CJK KR</family>
			<family>Noto Color Emoji</family>
			<family>Noto Emoji</family>
		</prefer>
	</alias>

	<alias>
		<family>serif</family>
		<prefer>
			<family>Noto Serif</family>
			<family>Noto Serif CJK SC</family>
			<family>Noto Serif CJK TC</family>
			<family>Noto Serif CJK JP</family>
			<family>Noto Serif CJK KR</family>
			<family>Noto Color Emoji</family>
			<family>Noto Emoji</family>
		</prefer>
	</alias>

	<alias>
		<family>monospace</family>
		<prefer>
			<family>Inconsolata Nerd Font</family>
			<family>Noto Sans CJK Mono SC</family>
			<family>Noto Sans CJK Mono TC</family>
			<family>Noto Sans CJK Mono JP</family>
			<family>Noto Sans CJK Mono KR</family>
			<family>Noto Color Emoji</family>
			<family>Noto Emoji</family>
		</prefer>
	</alias>

	<alias>
		<family>coding</family>
		<prefer>
			<family>FiraCode Nerd Font Mono</family>
			<family>Noto Sans CJK Mono SC</family>
			<family>Noto Sans CJK Mono TC</family>
			<family>Noto Sans CJK Mono JP</family>
			<family>Noto Sans CJK Mono KR</family>
			<family>Noto Color Emoji</family>
			<family>Noto Emoji</family>
		</prefer>
	</alias>

	<selectfont>
		<rejectfont>
			<pattern>
				<patelt name="family">
					<!-- This font is causing problem with GitHub -->
					<string>Nimbus Sans</string>
				</patelt>
			</pattern>
		</rejectfont>
	</selectfont>

</fontconfig>